name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Run test suite (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run config integrity test
        run: python -m pytest tests/test_config_integrity.py -v

      - name: Run full test suite
        run: python -m pytest tests/ -v --tb=short

      # Every recorded result must have a pre-registration that was committed
      # first. scripts/validation/prereg_check.py exits 1 if one does not.
      - name: Check every result was pre-registered
        run: |
          git fetch --unshallow || true
          python -I scripts/validation/prereg_check.py
